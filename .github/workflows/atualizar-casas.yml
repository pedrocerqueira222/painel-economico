name: Atualizar preço das casas

on:
  schedule:
    - cron: "17 * * * *"     # de hora a hora (o programa só vai ao INE se ainda não conseguiu nas últimas 20 h)
  workflow_dispatch:          # permite correr à mão no separador Actions
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ir buscar os dados ao INE
        timeout-minutes: 45
        continue-on-error: true
        env:
          FORCAR: ${{ github.event_name != 'schedule' }}   # corridas à mão ou depois de carregar ficheiros vão sempre ao INE
        run: python scripts/atualizar_casas.py
      - name: Guardar se houver dados novos
        if: always()
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          # guardar os ficheiros desta corrida e pô-los por cima da versão mais recente do repositório
          mkdir -p /tmp/novos && cp -r dados/. /tmp/novos/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p dados && cp -r /tmp/novos/. dados/ 2>/dev/null || true
          # uma vez por mês regista a verificação: o GitHub desliga tarefas de repositórios parados há 60 dias
          if [ "$(date +%d)" = "01" ] || [ ! -f dados/verificado.txt ]; then
            date -u +"Última verificação: %Y-%m-%d %H:%M UTC" > dados/verificado.txt
          fi
          git add dados/
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Dados atualizados (INE e Eurostat)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
            git push origin HEAD:main
          fi
