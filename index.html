  defaultYears: 10, perYear: 1,
  source: `Imigrantes: pessoas que passaram a viver em Portugal durante o ano (por um período de pelo menos 12 meses). Emigrantes: as que deixaram de viver cá. Saldo: a diferença entre as duas.
    O Eurostat publica cada ano com cerca de 15 meses de atraso. Fonte: Eurostat (migr_imm1ctz, migr_emi1ctz), a partir de dados do INE; copiado pela tarefa do GitHub.`,
  series: [
    { id: "IMM", label: "Imigrantes (chegam)", short: "Chegam", color: "--imm-b", stroke: "--imm-s" },
    { id: "EMI", label: "Emigrantes (saem)",   short: "Saem",   color: "--emi-b", stroke: "--emi-s" },
    { id: "NET", label: "Saldo migratório",    short: "Saldo",  color: "--net-s" },
  ],
  maxAge: 6 * 3600e3,
  async load() {
    const m = await ghFile("migracao.json");
    if (!m) throw ghMissing();
    const im = m.valores.imigrantes || [], em = m.valores.emigrantes || [];
    return { periods: m.periodos, values: { IMM: im, EMI: em, NET: im.map((v, k) => v != null && em[k] != null ? v - em[k] : null) }, errors: [], fetchedAt: Date.now() };
  },
  verdict(d) {
    const I = d.values.IMM, N = d.values.NET, i = lastIdx(I);
    if (i < 1) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    const y = (I[i] / I[i - 1] - 1) * 100;
    let text, color;
    if (y >= 5) { text = "Estão a chegar cada vez mais pessoas a Portugal"; color = "var(--up)"; }
    else if (y <= -5) { text = "Estão a chegar menos pessoas a Portugal"; color = "var(--down)"; }
    else { text = "A chegada de pessoas a Portugal está estável"; color = "var(--flat)"; }
    let msg = `Em ${d.periods[i]}, chegaram a Portugal cerca de ${fmt(Math.round(I[i] / 1000) * 1000, 0)} pessoas, ${y >= 0 ? "mais" : "menos"} ${fmt(Math.abs(y), 0)}% do que no ano anterior.`;
    if (N[i] != null) msg += ` Descontando as ${fmt(Math.round(d.values.EMI[i] / 1000) * 1000, 0)} que saíram, a população ${N[i] >= 0 ? "ganhou" : "perdeu"} cerca de ${fmt(Math.round(Math.abs(N[i]) / 1000) * 1000, 0)} pessoas por via da migração.`;
    const k5 = i - 5; if (k5 >= 0 && I[k5]) msg += ` Há cinco anos, em ${d.periods[k5]}, chegavam ${fmt(Math.round(I[k5] / 1000) * 1000, 0)}.`;
    return { text, color, msg };
  },
  rates(d) {
    return this.series.map(s => {
      const a = d.values[s.id], i = lastIdx(a);
      return { id: s.id, name: s.label + (i >= 0 ? " · " + d.periods[i] : ""), value: i >= 0 ? a[i] : null, d: 0, unit: "", signed: s.id === "NET",
               deltas: s.id === "NET" ? deltaHTML(a[i], a[i - 1], "vs ano anterior", 0, true, "") : deltaHTML(a[i] != null && a[i - 1] ? (a[i] / a[i - 1] - 1) * 100 : null, 0, "vs ano anterior", 1, false, "%") };
    });
  },
  datasets(d, start, end, visible) {
    return [barSet(this.series[0], d.values.IMM.slice(start, end), visible),
            barSet(this.series[1], d.values.EMI.slice(start, end).map(v => v == null ? null : -v), visible),
            lineSet(this.series[2], d.values.NET.slice(start, end), visible, { pointRadius: 3, borderWidth: 2.5 })];
  },
  label: p => p,
  tooltip: (s, v) => ` ${s.short}: ${fmt(Math.abs(v), 0)} pessoas`,
  yTick: v => fmt(v / 1000, 0) + " mil",
};

/* =====================================================================
   MÓDULO — Consumo e investimento (contas nacionais, BCE)
   ===================================================================== */
// escolhe, entre várias séries do BCE, a mais recente e com as características preferidas
function pickBest(rows, test, rank) {
  const series = {};
  for (const r of rows) if (r.v != null && test(r.key.split("."))) (series[r.key] ||= {})[r.t] = r.v;
  const last = k => Object.keys(series[k]).sort().pop();
  const keys = Object.keys(series).sort((a, b) => last(b).localeCompare(last(a)) || rank(a.split(".")) - rank(b.split(".")));
  return keys.length ? series[keys[0]] : null;
}
const mnaKey = (sto, prices) => ["Q", "", "PT", "", "", "", "", sto, "", "", "", "", prices, "N"].join(".");
const yoyMap = m => { const o = {}; for (const q in m) { const b = m[prevQ(q, 4)]; if (b) o[q] = (m[q] / b - 1) * 100; } return o; };
const adjRank = a => (["Y", "S", "N", "W"].indexOf(a) + 1 || 9);
const unitRank = u => (["EUR", "XDC"].indexOf(u) + 1 || 9);

const ECOCOMP = {
  key: "ecocomp",
  title: "Consumo e investimento",
  defaultYears: 5, perYear: 4,
  source: `Crescimento real (sem efeito dos preços) face ao mesmo trimestre do ano anterior, em Portugal.
    Consumo: despesa das famílias (cerca de 60% do PIB). Investimento: formação bruta de capital fixo, ou seja casas, fábricas, máquinas, estradas (cerca de 20% do PIB).
    Fonte: contas nacionais trimestrais do INE, <a href="https://data.ecb.europa.eu/data/datasets/MNA" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "CONS", label: "Consumo das famílias", short: "Consumo",      color: "--cons" },
    { id: "INV",  label: "Investimento",          short: "Investimento", color: "--inv" },
    { id: "GDP",  label: "PIB",                    short: "PIB",          color: "--gdp-l", dashed: true },
  ],
  async load() {
    const rows = await getCSV(ECB + "MNA/" + mnaKey("P31+P51G+B1GQ", "LR") + "?format=csvdata&startPeriod=1999-Q1");
    // posições na chave: 2 ajustamento, 5 setor, 8 operação, 9 ativo, 12 unidade
    const cons = pickBest(rows, p => p[8] === "P31" && ["S1M", "S14_S15", "S14"].includes(p[5]),
                          p => ["S1M", "S14_S15", "S14"].indexOf(p[5]) * 100 + adjRank(p[2]) * 10 + unitRank(p[12]));
    const inv = pickBest(rows, p => p[8] === "P51G" && p[5] === "S1" && ["N11G", "_Z", "N1G"].includes(p[9]),
                         p => ["N11G", "N1G", "_Z"].indexOf(p[9]) * 100 + adjRank(p[2]) * 10 + unitRank(p[12]));
    const gdp = pickBest(rows, p => p[8] === "B1GQ" && p[5] === "S1", p => adjRank(p[2]) * 10 + unitRank(p[12]));
    const errors = [];
    if (!cons) errors.push("consumo: sem dados"); if (!inv) errors.push("investimento: sem dados");
    const Y = { CONS: yoyMap(cons || {}), INV: yoyMap(inv || {}), GDP: yoyMap(gdp || {}) };
    const periods = [...new Set(Object.values(Y).flatMap(Object.keys))].sort();
    if (!periods.length) throw new Error("o BCE não devolveu valores das contas nacionais");
    return { periods, values: Object.fromEntries(Object.entries(Y).map(([k, m]) => [k, periods.map(q => m[q] ?? null)])), errors, fetchedAt: Date.now() };
  },
  verdict(d) {
    const C = d.values.CONS, I = d.values.INV, G = d.values.GDP;
    let i = d.periods.length - 1; while (i >= 0 && (C[i] == null || I[i] == null)) i--;
    if (i < 0) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    const c = C[i], v = I[i], g = G[i];
    let text, color;
    if (c < 0 && v < 0) { text = "Consumo e investimento estão a travar a economia"; color = "var(--up)"; }
    else if (c >= 1 && v >= 1) { text = v > c + 2 ? "O investimento está a puxar pela economia, com o consumo a ajudar" : "Consumo e investimento estão a sustentar a economia"; color = "var(--down)"; }
    else if (c >= 1) { text = "É o consumo das famílias que está a sustentar a economia"; color = "var(--flat)"; }
    else if (v >= 1) { text = "É o investimento que está a sustentar a economia"; color = "var(--flat)"; }
    else { text = "Consumo e investimento crescem pouco"; color = "var(--flat)"; }
    const v1 = x => (x >= 0 ? "cresceu " : "caiu ") + fmt(Math.abs(x), 1) + "%";
    let msg = `No ${qLong(d.periods[i])}, face a um ano antes, o consumo das famílias ${v1(c)} e o investimento ${v1(v)}` + (g != null ? `, com o PIB a crescer ${fmt(g, 1)}%.` : ".");
    const c4 = C[i - 4], i4 = I[i - 4];
    if (c4 != null && i4 != null) msg += ` Há um ano, o consumo crescia ${fmt(c4, 1)}% e o investimento ${fmt(i4, 1)}%.`;
    msg += " Como o consumo pesa cerca de três vezes mais do que o investimento no PIB, uma subida de 1% no consumo vale mais para a economia do que 1% no investimento.";
    return { text, color, msg };
  },
  rates(d) {
    return this.series.map(s => {
      const a = d.values[s.id], i = lastIdx(a);
      return { id: s.id, name: s.label + (i >= 0 ? " · " + qLabel(d.periods[i]) : ""), value: i >= 0 ? a[i] : null, d: 1, unit: "%", signed: true,
               deltas: (i >= 0 ? "<span>crescimento real num ano</span>" : "") + deltaHTML(a[i], a[i - 1], "vs trimestre anterior", 1, true, " p.p.") };
    });
  },
  datasets(d, start, end, visible) {
    return this.series.map(s => ({ type: "line", label: s.label, data: d.values[s.id].slice(start, end), hidden: !visible[s.id],
      borderColor: css(s.color), backgroundColor: css(s.color), borderWidth: s.dashed ? 2 : 2.5, borderDash: s.dashed ? [5, 4] : [],
      pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true, order: s.dashed ? 2 : 1 }));
  },
  label: qLabel,
  tooltip: (s, v) => ` ${s.short}: ${sign(v)}${fmt(Math.abs(v), 1)}%`,
  yTick: v => fmt(v, 0) + "%",
};

/* =====================================================================
   MÓDULO — Contas com o exterior (BCE)
   ===================================================================== */
const TRADE = {
  key: "trade",
  title: "Contas com o exterior",
  defaultYears: 10, perYear: 4,
  source: `Saldo de bens e serviços: exportações menos importações. Balança corrente: esse saldo mais os rendimentos (juros, dividendos, salários) e as transferências (por exemplo, remessas de emigrantes e fundos europeus) trocados com o exterior.
    Ambos somados nos últimos 12 meses e em % do PIB, para não depender das épocas do ano (o turismo pesa muito no verão).
    Fonte: contas nacionais do INE e balança de pagamentos do Banco de Portugal, <a href="https://data.ecb.europa.eu/data/datasets/BP6" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "TB", label: "Saldo de bens e serviços", short: "Bens e serviços", color: "--tb-up" },
    { id: "CA", label: "Balança corrente",          short: "Balança corrente", color: "--ca" },
  ],
  async load(prev) {
    const [mna, bop] = await Promise.allSettled([
      getCSV(ECB + "MNA/" + mnaKey("P6+P7+B1GQ", "V") + "?format=csvdata&startPeriod=1999-Q1"),
      getCSV(ECB + "BP6/Q.N.PT.W1.S1.S1.T.B.CA._Z._Z._Z.EUR._T._X.N?format=csvdata&startPeriod=1999-Q1"),
    ]);
    if (mna.status === "rejected") throw new Error(mna.reason.message);
    const rows = mna.value, errors = [];
    const byArea = p => ["W1", "W0", "W2"].indexOf(p[4]) + 1 || 9;
    const adjN = a => (["N", "Y", "S", "W"].indexOf(a) + 1 || 9);
    const exp = pickBest(rows, p => p[8] === "P6" && p[5] === "S1", p => byArea(p) * 100 + adjN(p[2]) * 10 + unitRank(p[12]));
    const imp = pickBest(rows, p => p[8] === "P7" && p[5] === "S1", p => byArea(p) * 100 + adjN(p[2]) * 10 + unitRank(p[12]));
    const gdp = pickBest(rows, p => p[8] === "B1GQ" && p[5] === "S1", p => adjN(p[2]) * 10 + unitRank(p[12]));
    if (!exp || !imp || !gdp) throw new Error("o BCE não devolveu exportações, importações ou PIB de Portugal");
    let ca = prev?.caQ || {};
    if (bop.status === "fulfilled") { ca = {}; for (const r of bop.value) if (r.v != null) ca[r.t] = r.v; }
    else errors.push("balança corrente: " + bop.reason.message);
    const qs = Object.keys(gdp).sort();
    const roll = (m, q) => { let t = 0; for (let k = 0; k < 4; k++) { const v = m[prevQ(q, k)]; if (v == null) return null; t += v; } return t; };
    const periods = [], TB = [], CA = [], EXP = [], IMP = [];
    for (const q of qs) {
      const g = roll(gdp, q); if (g == null) continue;
      const e = roll(exp, q), m = roll(imp, q), c = roll(ca, q);
      periods.push(q);
      TB.push(e != null && m != null ? (e - m) / g * 100 : null);
      CA.push(c != null ? c / g * 100 : null);
      EXP.push(e); IMP.push(m);
    }
    return { periods, values: { TB, CA }, exp12: EXP, imp12: IMP, caQ: ca, errors, fetchedAt: Date.now() };
  },
  verdict(d) {
    const T = d.values.TB, C = d.values.CA;
    const iC = lastIdx(C), iT = lastIdx(T);
    const main = iC >= 0 ? C[iC] : iT >= 0 ? T[iT] : null;
    if (main == null) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    let text, color;
    if (main >= 0.5) { text = "Portugal está a ganhar dinheiro face ao exterior"; color = "var(--down)"; }
    else if (main <= -0.5) { text = "Portugal está a gastar mais do que ganha face ao exterior"; color = "var(--up)"; }
    else { text = "As contas de Portugal com o exterior estão equilibradas"; color = "var(--flat)"; }
    const bil = v => fmt(v / 1000, 1) + " mil milhões de euros";
    let msg = "";
    if (iT >= 0) {
      const e = d.exp12[iT], m = d.imp12[iT], e4 = d.exp12[iT - 4], m4 = d.imp12[iT - 4];
      msg += `Nos 12 meses até ao ${qLong(d.periods[iT])}, Portugal exportou ${bil(e)} e importou ${bil(m)}: um ${T[iT] >= 0 ? "excedente" : "défice"} de ${fmt(Math.abs(T[iT]), 1)}% do PIB em bens e serviços.`;
      if (e4 && m4) msg += ` Num ano, as exportações ${e >= e4 ? "subiram" : "desceram"} ${fmt(Math.abs((e / e4 - 1) * 100), 1)}% e as importações ${m >= m4 ? "subiram" : "desceram"} ${fmt(Math.abs((m / m4 - 1) * 100), 1)}%.`;
    }
    if (iC >= 0) {
      msg += ` Juntando rendimentos e transferências, a balança corrente está em ${sign(C[iC])}${fmt(Math.abs(C[iC]), 1)}% do PIB` +
             (C[iC - 4] != null ? ` (${sign(C[iC - 4])}${fmt(Math.abs(C[iC - 4]), 1)}% um ano antes).` : ".");
      msg += C[iC] >= 0 ? " Ou seja, o país recebe do exterior mais do que paga e não precisa de se endividar lá fora." : " Ou seja, o país paga ao exterior mais do que recebe e tem de se financiar lá fora.";
    }
    return { text, color, msg: msg.trim() };
  },
  rates(d) {
    return this.series.map(s => {
      const a = d.values[s.id], i = lastIdx(a);
      return { id: s.id, name: s.label + (i >= 0 ? " · 12 meses até " + qLabel(d.periods[i]) : ""), value: i >= 0 ? a[i] : null, d: 1, unit: "% do PIB", signed: true,
               deltas: deltaHTML(a[i], a[i - 4], "vs um ano antes", 1, true, " p.p.") + deltaHTML(a[i], a[i - 1], "vs trimestre anterior", 1, true, " p.p.") };
    });
  },
  datasets(d, start, end, visible) {
    const data = d.values.TB.slice(start, end), up = css("--tb-up"), down = css("--tb-down");
    return [
      { type: "bar", label: this.series[0].label, data, hidden: !visible.TB, backgroundColor: data.map(v => v >= 0 ? up : down), borderWidth: 0, borderRadius: 2, maxBarThickness: 16, order: 2 },
      { type: "line", label: this.series[1].label, data: d.values.CA.slice(start, end), hidden: !visible.CA, borderColor: css("--ca"), backgroundColor: css("--ca"),
        borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true, order: 1 },
    ];
  },
  label: qLabel,
  tooltip: (s, v) => ` ${s.short}: ${sign(v)}${fmt(Math.abs(v), 1)}% do PIB`,
  yTick: v => fmt(v, 0) + "%",
};

/* =====================================================================
   MÓDULO — Juros da dívida pública: Portugal vs Alemanha (BCE)
   ===================================================================== */
const BONDS = {
  key: "bonds",
  title: "Juros da dívida: Portugal vs Alemanha",
  defaultYears: 10, perYear: 12,
  source: `Taxa de juro das obrigações do Tesouro a 10 anos (média mensal, critério de convergência de Maastricht). A diferença para a Alemanha, o "spread", mede quanto mais os investidores exigem para emprestar a Portugal: quanto menor, maior a confiança.
    Fonte: <a href="https://data.ecb.europa.eu/data/datasets/IRS" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "PT",  label: "Portugal",               short: "Portugal", color: "--bpt" },
    { id: "DE",  label: "Alemanha",               short: "Alemanha", color: "--bde" },
    { id: "SPR", label: "Diferença (spread)",     short: "Spread",   color: "--spr" },
  ],
  async load() {
    const rows = await getCSV(ECB + "IRS/M.PT+DE.L.L40.CI.0000.EUR.N.Z?format=csvdata&startPeriod=1999-01");
    const by = { PT: {}, DE: {} };
    for (const r of rows) { const a = r.key.split(".")[2]; if (by[a] && r.v != null) by[a][r.t] = r.v; }
    const periods = [...new Set([...Object.keys(by.PT), ...Object.keys(by.DE)])].sort();
    const PT = periods.map(p => by.PT[p] ?? null), DE = periods.map(p => by.DE[p] ?? null);
    return { periods, values: { PT, DE, SPR: PT.map((v, k) => v != null && DE[k] != null ? v - DE[k] : null) }, errors: [], fetchedAt: Date.now() };
  },
  verdict(d) {
    const S = d.values.SPR, i = lastIdx(S);
    if (i < 0) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    const s = S[i], s12 = S[i - 12];
    let text, color;
    if (s <= 0.75) { text = "Os mercados confiam na dívida portuguesa"; color = "var(--down)"; }
    else if (s <= 2) { text = "A dívida portuguesa paga um prémio moderado"; color = "var(--flat)"; }
    else { text = "Os mercados estão a exigir mais juros a Portugal"; color = "var(--up)"; }
    let msg = `Em ${monthLong(d.periods[i])}, o Estado português pagava ${fmt(d.values.PT[i], 2)}% para se financiar a 10 anos e a Alemanha ${fmt(d.values.DE[i], 2)}%: uma diferença de ${fmt(s, 2)} pontos`;
    msg += s12 != null ? `, ${Math.abs(s - s12) < 0.05 ? "praticamente igual a" : fmt(Math.abs(s - s12), 2) + " pontos " + (s < s12 ? "abaixo de" : "acima de")} há um ano.` : ".";
    let pk = 0; for (let k = 0; k <= i; k++) if (S[k] != null && (S[pk] == null || S[k] > S[pk])) pk = k;
    if (S[pk] != null && S[pk] > s + 1) msg += ` No pior momento, em ${monthLong(d.periods[pk])}, a diferença chegou a ${fmt(S[pk], 1)} pontos.`;
    msg += " Um spread baixo quer dizer juros mais baixos para o Estado e, indiretamente, para bancos, empresas e famílias.";
    return { text, color, msg };
  },
  rates(d) {
    return this.series.map(s => {
      const a = d.values[s.id], i = lastIdx(a);
      return { id: s.id, name: s.label + (i >= 0 ? " · " + monthLabel(d.periods[i]) : ""), value: i >= 0 ? a[i] : null, d: 2, unit: s.id === "SPR" ? " p.p." : "%",
               deltas: deltaHTML(a[i], a[i - 1], "vs mês anterior", 2, false, " p.p.") + deltaHTML(a[i], a[i - 12], "vs há um ano", 2, false, " p.p.") };
    });
  },
  datasets(d, start, end, visible) {
    return [
      { type: "line", label: "Portugal", data: d.values.PT.slice(start, end), hidden: !visible.PT, borderColor: css("--bpt"), backgroundColor: css("--bpt"), borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true, order: 1 },
      { type: "line", label: "Alemanha", data: d.values.DE.slice(start, end), hidden: !visible.DE, borderColor: css("--bde"), backgroundColor: css("--bde"), borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true, order: 1 },
      { type: "bar", label: "Diferença (spread)", data: d.values.SPR.slice(start, end), hidden: !visible.SPR, backgroundColor: css("--spr"), borderWidth: 0, barPercentage: 1, categoryPercentage: 1, order: 2 },
    ];
  },
  label: monthLabel,
  tooltip: (s, v) => s.id === "SPR" ? ` Spread: ${fmt(v, 2)} p.p.` : ` ${s.short}: ${fmt(v, 2)}%`,
  yTick: v => fmt(v, v % 1 === 0 ? 0 : 1) + "%",
};

/* =====================================================================
   MÓDULO — Dívida pública e défice (BCE)
   ===================================================================== */
const GOV = {
  key: "gov",
  title: "Dívida pública e défice",
  defaultYears: 10, perYear: 4,
  source: `Dívida pública: dívida bruta das administrações públicas (critério de Maastricht) em % do PIB dos últimos 12 meses, no fim de cada trimestre.
    Saldo orçamental: receitas menos despesas do Estado em % do PIB (negativo = défice). As regras europeias apontam para dívida abaixo de 60% do PIB e défice abaixo de 3%.
    Fonte: INE e Banco de Portugal, <a href="https://data.ecb.europa.eu/data/datasets/GFS" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "DEBT", label: "Dívida pública", short: "Dívida", color: "--debt" },
    { id: "BAL",  label: "Saldo orçamental", short: "Saldo", color: "--bal-up" },
  ],
  async load(prev) {
    const [debt, balQ, balA] = await Promise.allSettled([
      getCSV(ECB + "GFS/Q.N.PT.W0.S13.S1.C.L.LE.GD.T._Z.XDC_R_B1GQ_CY._T.F.V.N._T?format=csvdata&startPeriod=2000-Q1"),
      getCSV(ECB + "GFS/Q.N.PT.W0.S13.S1._Z.B.B9._Z._Z._Z.XDC_R_B1GQ_CY._Z.S.V.N._T?format=csvdata&startPeriod=2000-Q1"),
      getCSV(ECB + "GFS/A.N.PT.W0.S13.S1._Z.B.B9._Z._Z._Z.XDC_R_B1GQ._Z.S.V.N._T?format=csvdata&startPeriod=2000"),
    ]);
    if (debt.status === "rejected") throw new Error(debt.reason.message);
    const errors = [], D = {}, B = {};
    for (const r of debt.value) if (r.v != null) D[r.t] = r.v;
    let balFreq = "q";
    if (balQ.status === "fulfilled") { for (const r of balQ.value) if (r.v != null) B[r.t] = r.v; }
    if (!Object.keys(B).length && balA.status === "fulfilled") { balFreq = "a"; for (const r of balA.value) if (r.v != null) B[r.t + "-Q4"] = r.v; }
    if (!Object.keys(B).length) errors.push("saldo orçamental: sem dados");
    const periods = [...new Set([...Object.keys(D), ...Object.keys(B)])].sort();
    return { periods, balFreq, values: { DEBT: periods.map(q => D[q] ?? null), BAL: periods.map(q => B[q] ?? null) }, errors, fetchedAt: Date.now() };
  },
  verdict(d) {
    const D = d.values.DEBT, B = d.values.BAL, i = lastIdx(D), j = lastIdx(B);
    if (i < 4) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    const dd = D[i] - D[i - 4], bal = j >= 0 ? B[j] : null;
    let text, color;
    if (dd <= -1 && bal != null && bal >= 0) { text = "As contas públicas estão a melhorar"; color = "var(--down)"; }
    else if (dd <= -1) { text = "A dívida pública está a descer"; color = "var(--down)"; }
    else if (dd >= 1 && bal != null && bal < -3) { text = "As contas públicas estão a piorar"; color = "var(--up)"; }
    else if (dd >= 1) { text = "A dívida pública está a subir"; color = "var(--up)"; }
    else { text = "A dívida pública está estável"; color = "var(--flat)"; }
    let msg = `No fim do ${qLong(d.periods[i])}, a dívida pública era de ${fmt(D[i], 1)}% do PIB, ${Math.abs(dd) < 0.1 ? "igual a" : fmt(Math.abs(dd), 1) + " pontos " + (dd < 0 ? "abaixo de" : "acima de")} um ano antes.`;
    let pk = 0; for (let k = 0; k <= i; k++) if (D[k] != null && (D[pk] == null || D[k] > D[pk])) pk = k;
    if (D[pk] - D[i] > 5) msg += ` O máximo foi ${fmt(D[pk], 1)}% no ${qLong(d.periods[pk])}.`;
    if (bal != null) {
      const when = d.balFreq === "a" ? "em " + d.periods[j].slice(0, 4) : "nos 12 meses até ao " + qLong(d.periods[j]);
      msg += ` O Estado teve ${bal >= 0 ? "um excedente" : "um défice"} de ${fmt(Math.abs(bal), 1)}% do PIB ${when}.`;
    }
    msg += D[i] > 60 ? ` A dívida continua acima do limite europeu de 60% do PIB.` : ` A dívida está abaixo do limite europeu de 60% do PIB.`;
    return { text, color, msg };
  },
  rates(d) {
    const D = d.values.DEBT, B = d.values.BAL, i = lastIdx(D), j = lastIdx(B);
    const jPrev = (() => { for (let k = j - (d.balFreq === "a" ? 1 : 4); k >= 0; k--) if (B[k] != null) return k; return -1; })();
    return [
      { id: "DEBT", name: "Dívida pública · " + (i >= 0 ? qLabel(d.periods[i]) : "—"), value: i >= 0 ? D[i] : null, d: 1, unit: "% do PIB",
        deltas: deltaHTML(D[i], D[i - 4], "vs um ano antes", 1, false, " p.p.") + deltaHTML(D[i], D[i - 1], "vs trimestre anterior", 1, false, " p.p.") },
      { id: "BAL", name: "Saldo orçamental · " + (j >= 0 ? (d.balFreq === "a" ? d.periods[j].slice(0, 4) : "12 meses até " + qLabel(d.periods[j])) : "—"), value: j >= 0 ? B[j] : null, d: 1, unit: "% do PIB", signed: true,
        deltas: (j >= 0 ? `<span>${B[j] >= 0 ? "excedente" : "défice"}</span>` : "") + (jPrev >= 0 ? deltaHTML(B[j], B[jPrev], d.balFreq === "a" ? "vs ano anterior" : "vs um ano antes", 1, true, " p.p.") : "") },
    ];
  },
  datasets(d, start, end, visible) {
    const bal = d.values.BAL.slice(start, end), up = css("--bal-up"), down = css("--bal-down");
    return [
      { type: "line", label: "Dívida pública", data: d.values.DEBT.slice(start, end), hidden: !visible.DEBT, yAxisID: "y", borderColor: css("--debt"), backgroundColor: css("--debt"), borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true, order: 1 },
      { type: "bar", label: "Saldo orçamental", data: bal, hidden: !visible.BAL, yAxisID: "y2", backgroundColor: bal.map(v => v >= 0 ? up : down), borderWidth: 0, borderRadius: 2, maxBarThickness: 16, order: 2 },
    ];
  },
  y2: { tick: v => fmt(v, 0) + "%" },
  label: qLabel,
  tooltip: (s, v) => s.id === "DEBT" ? ` Dívida: ${fmt(v, 1)}% do PIB` : ` Saldo: ${sign(v)}${fmt(Math.abs(v), 1)}% do PIB`,
  yTick: v => fmt(v, 0) + "%",
};

/* =====================================================================
   MÓDULO — As casas estão sobrevalorizadas? (BCE)
   ===================================================================== */
const OVER = {
  key: "over",
  container: "modules-hab",
  title: "As casas estão sobrevalorizadas?",
  defaultYears: 0, perYear: 4,
  source: `Preço real das casas: índice de preços da habitação (INE) descontada a inflação, medida pelo deflator do consumo privado, como faz o Banco de Portugal.
    Tendência: linha reta ajustada a todo o período disponível (em escala logarítmica). O Banco de Portugal considera haver sobrevalorização quando o preço real fica mais de 10% acima da tendência de longo prazo.
    Atenção: é uma estimativa simples, feita pela página, e não o modelo oficial do Banco de Portugal; o valor exato depende do método e do período usado.
    Fonte: INE, <a href="https://data.ecb.europa.eu/data/datasets/RESR" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "REAL",  label: "Preço real das casas",      short: "Preço real", color: "--hpi" },
    { id: "TREND", label: "Tendência de longo prazo",  short: "Tendência",  color: "--ratio", dashed: true },
    { id: "GAP",   label: "Distância à tendência",     short: "Distância",  color: "--gap-up" },
  ],
  async load() {
    const [hpi, cons] = await Promise.all([
      getCSV(ECB + "RESR/Q.PT._T.N._TR.TVAL..TB.N.IX?format=csvdata&startPeriod=2000-Q1"),
      getCSV(ECB + "MNA/" + mnaKey("P31", "") + "?format=csvdata&startPeriod=2000-Q1"),
    ]);
    const H = pickBest(hpi, p => true, p => ["4D0", "4F0", "29"].indexOf(p[7]) + 1 || 9);
    const pc = p => ["S1M", "S14_S15", "S14"].includes(p[5]);
    const rk = p => ["S1M", "S14_S15", "S14"].indexOf(p[5]) * 100 + adjRank(p[2]) * 10 + unitRank(p[12]);
    const V = pickBest(cons, p => p[8] === "P31" && pc(p) && p[13] === "V", rk);
    const L = pickBest(cons, p => p[8] === "P31" && pc(p) && p[13] === "LR", rk);
    if (!H || !V || !L) throw new Error("faltam dados do BCE para calcular o preço real");
    const qs = Object.keys(H).filter(q => V[q] && L[q]).sort();
    if (qs.length < 12) throw new Error("dados insuficientes");
    const real0 = qs.map(q => H[q] / (V[q] / L[q]));
    const base = real0[0], REAL = real0.map(v => v / base * 100);
    // tendência log-linear (mínimos quadrados)
    const n = REAL.length, xs = REAL.map((_, k) => k), ys = REAL.map(Math.log);
    const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
    let sxy = 0, sxx = 0; for (let k = 0; k < n; k++) { sxy += (xs[k] - mx) * (ys[k] - my); sxx += (xs[k] - mx) ** 2; }
    const b = sxy / sxx, a = my - b * mx;
    const TREND = xs.map(x => Math.exp(a + b * x));
    return { periods: qs, values: { REAL, TREND, GAP: REAL.map((v, k) => (v / TREND[k] - 1) * 100) }, errors: [], fetchedAt: Date.now() };
  },
  verdict(d) {
    const G = d.values.GAP, R = d.values.REAL, i = lastIdx(G);
    if (i < 4) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    const g = G[i], ry = (R[i] / R[i - 4] - 1) * 100;
    let text, color;
    if (g >= 10) { text = "As casas parecem sobrevalorizadas"; color = "var(--up)"; }
    else if (g >= 3) { text = "Os preços das casas estão acima da tendência"; color = "var(--flat)"; }
    else if (g <= -10) { text = "As casas parecem abaixo do seu valor de tendência"; color = "var(--down)"; }
    else { text = "Os preços das casas estão perto da tendência de longo prazo"; color = "var(--flat)"; }
    let msg = `No ${qLong(d.periods[i])}, o preço das casas descontada a inflação estava ${fmt(Math.abs(g), 0)}% ${g >= 0 ? "acima" : "abaixo"} da sua tendência de longo prazo (desde ${qLabel(d.periods[0])}).`;
    msg += ` Num ano, os preços reais ${ry >= 0 ? "subiram" : "desceram"} ${fmt(Math.abs(ry), 1)}%, ou seja, ${ry >= 0 ? "mais" : "menos"} do que a inflação.`;
    let lo = 0; for (let k = 0; k <= i; k++) if (G[k] < G[lo]) lo = k;
    if (G[lo] < -10) msg += ` No ponto mais baixo, no ${qLong(d.periods[lo])}, estavam ${fmt(Math.abs(G[lo]), 0)}% abaixo.`;
    msg += " É uma estimativa simples: serve para ver a tendência, não para dar um valor exato.";
    return { text, color, msg };
  },
  rates(d) {
    const G = d.values.GAP, R = d.values.REAL, i = lastIdx(G);
    return [
      { id: "GAP", name: "Distância à tendência · " + (i >= 0 ? qLabel(d.periods[i]) : "—"), value: i >= 0 ? G[i] : null, d: 0, unit: "%", signed: true,
        deltas: `<span>acima de +10% = sobrevalorização</span>` + deltaHTML(G[i], G[i - 4], "vs um ano antes", 0, false, " p.p.") },
      { id: "REAL", name: "Preço real das casas · " + (i >= 0 ? qLabel(d.periods[i]) : "—"), value: i >= 4 ? (R[i] / R[i - 4] - 1) * 100 : null, d: 1, unit: "%", signed: true,
        deltas: `<span>subida num ano, descontada a inflação</span>` },
    ];
  },
  datasets(d, start, end, visible) {
    const gap = d.values.GAP.slice(start, end), up = css("--gap-up"), down = css("--gap-down");
    return [
      { type: "line", label: "Preço real das casas", data: d.values.REAL.slice(start, end), hidden: !visible.REAL, yAxisID: "y", borderColor: css("--hpi"), backgroundColor: css("--hpi"), borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, order: 1 },
      { type: "line", label: "Tendência de longo prazo", data: d.values.TREND.slice(start, end), hidden: !visible.TREND, yAxisID: "y", borderColor: css("--ratio"), backgroundColor: css("--ratio"), borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 4, order: 1 },
      { type: "bar", label: "Distância à tendência", data: gap, hidden: !visible.GAP, yAxisID: "y2", backgroundColor: gap.map(v => v >= 0 ? up : down), borderWidth: 0, borderRadius: 2, maxBarThickness: 12, order: 2 },
    ];
  },
  y2: { tick: v => sign(v) + fmt(Math.abs(v), 0) + "%" },
  label: qLabel,
  tooltip: (s, v) => s.id === "GAP" ? ` Distância à tendência: ${sign(v)}${fmt(Math.abs(v), 0)}%` : ` ${s.short}: ${fmt(v, 0)}`,
  yTick: v => fmt(v, 0),
};

/* =====================================================================

const MLOANS = {
  key: "mloans",

    Renegociações: créditos antigos cujas condições foram alteradas, muitas vezes para baixar a prestação.
    Fonte: Banco de Portugal, <a href="https://data.ecb.europa.eu/data/datasets/MIR" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "NEW", label: "Novos créditos no mês",       short: "Novos",          color: "--sales" },
    { id: "AVG", label: "Média dos últimos 12 meses",  short: "Média 12 meses", color: "--cred" },
    { id: "REN", label: "Renegociações",               short: "Renegociações",  color: "--ratio", dashed: true },
  ],
  async load() {
    const rows = await getCSV(ECB + "MIR/M.PT.B.A2C.A.B.A.2250.EUR.?format=csvdata&startPeriod=2003-01");
    const by = {};
    for (const r of rows) if (r.v != null) (by[r.key.split(".").pop()] ||= {})[r.t] = r.v;
    let P = by.P, R = by.R;
    if (!P && by.N && R) { P = {}; for (const m in by.N) if (R[m] != null) P[m] = by.N[m] - R[m]; }
    if (!P) P = by.N;
    if (!P) throw new Error("o BCE não tem os montantes de crédito à habitação para Portugal");
    const periods = Object.keys(P).sort();
    const NEW = periods.map(m => P[m]);
    const AVG = NEW.map((_, i) => { if (i < 11) return null; let t = 0; for (let k = i - 11; k <= i; k++) t += NEW[k]; return t / 12; });
    return { periods, pureNew: !!by.P, values: { NEW, AVG, REN: periods.map(m => R?.[m] ?? null) }, errors: [], fetchedAt: Date.now() };
  },
  verdict(d) {
    const N = d.values.NEW, A = d.values.AVG, R = d.values.REN, i = lastIdx(N);
    if (i < 23) return { text: "Sem dados suficientes", color: "var(--flat)", msg: "" };
    const t12 = A[i] * 12, t12a = A[i - 12] * 12, y = (t12 / t12a - 1) * 100;
    let text, color;
    if (y >= 10) { text = "As famílias estão a pedir muito mais crédito à habitação"; color = "var(--up)"; }
    else if (y >= 3) { text = "As famílias estão a pedir mais crédito à habitação"; color = "var(--up)"; }
    else if (y > -3) { text = "O crédito à habitação pedido está estável"; color = "var(--flat)"; }
    else { text = "As famílias estão a pedir menos crédito à habitação"; color = "var(--down)"; }
    const mil = v => fmt(v / 1000, 1) + " mil milhões de euros";
    let msg = `Nos 12 meses até ${monthLong(d.periods[i])}, os bancos concederam ${mil(t12)} em novos créditos à habitação, ${y >= 0 ? "mais" : "menos"} ${fmt(Math.abs(y), 0)}% do que nos 12 meses anteriores.`;
    if (N[i - 12] != null) msg += ` Só em ${monthLong(d.periods[i]).replace(/ de \d{4}$/, "")}, foram ${fmt(N[i], 0)} milhões, contra ${fmt(N[i - 12], 0)} milhões no mesmo mês do ano passado.`;
    // máximo desde quando?
    let k = i - 1; while (k >= 11 && (A[k] == null || A[k] <= A[i])) k--;
    if (k < i - 24) msg += k >= 11 ? ` É o valor mais alto desde ${d.periods[k].slice(0, 4)}.` : " É o valor mais alto da série.";
    const r12 = R.slice(i - 11, i + 1).every(v => v != null) ? R.slice(i - 11, i + 1).reduce((a, b) => a + b, 0) : null;

        deltas: deltaHTML(pct(t12, t12a), 0, "vs 12 meses anteriores", 1, false, "%") },
      { id: "REN", name: "Renegociações · 12 meses", value: r12 != null ? r12 / 1000 : null, d: 1, unit: " mil M€",
        deltas: deltaHTML(pct(r12, r12a), 0, "vs 12 meses anteriores", 1, false, "%") },
    ];
  },

const ghCache = {};
async function ghJson(file, force) {
  const c = ghCache[file];
  if (!force && c && Date.now() - c.t < 60000) return c.p;
  const p = (async () => {
    for (const u of HOUSE.githubUrls(file)) {
      try { const r = await fetchTimeout(u + "?t=" + Date.now(), 15000); if (r.ok) return await r.json(); } catch (e) {}
    }
    return null;
  })();
  ghCache[file] = { t: Date.now(), p };
  return p;
}
async function mercados(force) {
  const j = await ghJson("mercados.json", force);
  if (!j || !j.series) throw ghMissing();
  return j;
}
const serieMap = s => { const m = {}; if (s) s.datas.forEach((d, k) => { if (s.valores[k] != null) m[d] = s.valores[k]; }); return m; };
// valor numa data (último conhecido até essa data)
function valorEm(dates, vals, alvo) { let r = null; for (let k = 0; k < dates.length && dates[k] <= alvo; k++) if (vals[k] != null) r = vals[k]; return r; }
function diasAntes(d, n) { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0, 10); }
function varDias(dates, vals, n) { const i = lastIdx(vals); if (i < 0) return null; const b = valorEm(dates, vals, diasAntes(dates[i], n)); return b ? (vals[i] / b - 1) * 100 : null; }
function varAno(dates, vals) { const i = lastIdx(vals); if (i < 0) return null; const b = valorEm(dates, vals, (+dates[i].slice(0, 4) - 1) + "-12-31"); return b ? (vals[i] / b - 1) * 100 : null; }
function perto52(dates, vals) { const i = lastIdx(vals); if (i < 0) return null; const ini = diasAntes(dates[i], 365); let mx = -Infinity; for (let k = 0; k <= i; k++) if (dates[k] >= ini && vals[k] != null) mx = Math.max(mx, vals[k]); return vals[i] / mx; }
const pctTxt = (x, d = 1) => x == null ? "—" : sign(x) + fmt(Math.abs(x), d) + "%";
const dLabel = d => { const [y, m, dd] = d.split("-"); return (+dd) + " " + MESES[+m - 1] + " " + y.slice(2); };
const mktNote = j => j?.atualizado ? ` Dados copiados a ${timeLabel(Date.parse(j.atualizado))}.` : "";

const FAM = {

  source: `Taxa de poupança: parte do rendimento disponível das famílias que não é gasta em consumo (últimos 12 meses).

    As linhas tracejadas são a média da zona euro. O Banco de Portugal acompanha os dois indicadores como sinais de vulnerabilidade das famílias.
    Fonte: contas setoriais trimestrais (INE e Banco de Portugal), <a href="https://data.ecb.europa.eu/data/datasets/QSA" target="_blank" rel="noopener">BCE Data Portal</a>.`,
  series: [
    { id: "SAVPT",  label: "Poupança · Portugal",        short: "Poupança PT",      color: "--cons" },
    { id: "SAVEA",  label: "Poupança · zona euro",       short: "Poupança zona euro", color: "--cons", dashed: true },
    { id: "DEBTPT", label: "Endividamento · Portugal",   short: "Dívida PT",         color: "--debt" },
    { id: "DEBTEA", label: "Endividamento · zona euro",  short: "Dívida zona euro",  color: "--debt", dashed: true },
  ],
  async load() {
    const [sav, debt] = await Promise.allSettled([
      getCSV(ECB + "QSA/Q.N.PT+I9.W0.S1M.S1._Z.B.B8G._Z._Z._Z.XDC_R_B6GA_CY._T.S.V.C4._T?format=csvdata&startPeriod=1999-Q1"),
      getCSV(ECB + "QSA/Q.N.PT+I9.W0.S1M.S1.N.L.LE.F4.T._Z.XDC_R_B6G_CY._T.S.V.N._T?format=csvdata&startPeriod=1999-Q1"),
    ]);
    if (sav.status === "rejected" && debt.status === "rejected") throw new Error(sav.reason.message);
    const errors = [];
    // zona euro: usa a composição mais recente disponível (I21 > … > I9)
    const split = rows => { const by = {}; for (const r of rows) if (r.v != null) (by[r.key.split(".")[3]] ||= {})[r.t] = r.v; return by; };
    const ea = by => { const ks = Object.keys(by).filter(k => /^I\d+$/.test(k)).sort((a, b) => +b.slice(1) - +a.slice(1)); return ks.length ? by[ks[0]] : {}; };
    const S = sav.status === "fulfilled" ? split(sav.value) : {}, D = debt.status === "fulfilled" ? split(debt.value) : {};

    else if (dd >= 2) { text = "O endividamento das famílias está a subir"; color = "var(--up)"; }
    else if (ds >= 1 && dd <= 0) { text = "As famílias estão a poupar mais e a reduzir o peso das dívidas"; color = "var(--down)"; }
    else if (dd <= -2) { text = "O peso das dívidas das famílias está a descer"; color = "var(--down)"; }
    else { text = "Poupança e endividamento das famílias estão estáveis"; color = "var(--flat)"; }
    let msg = "";
    const ea = (id, k) => { const a = d.values[id]; for (let j = k; j >= 0; j--) if (a[j] != null) return a[j]; return null; };
    if (iS >= 0) {
      const e = ea("SAVEA", iS);
      msg += `Nos 12 meses até ao ${qLong(d.periods[iS])}, as famílias pouparam ${fmt(S[iS], 1)}% do seu rendimento disponível` +
             (iS >= 4 ? (Math.abs(ds) < 0.05 ? " (igual a há um ano)" : ` (${sign(ds)}${fmt(Math.abs(ds), 1)} pontos num ano)`) : "") + (e != null ? `, contra ${fmt(e, 1)}% na média da zona euro.` : ".");
    }
    if (iD >= 0) {

             (iD >= 4 ? (Math.abs(dd) < 0.05 ? " (igual a há um ano)" : ` (${sign(dd)}${fmt(Math.abs(dd), 1)} pontos num ano)`) : "") + (e != null ? `; na zona euro, ${fmt(e, 0)}%.` : ".");
      let pk = 0; for (let k = 0; k <= iD; k++) if (D[k] != null && (D[pk] == null || D[k] > D[pk])) pk = k;

  },
  rates(d) {

               deltas: deltaHTML(a[i], a[i - 4], "vs um ano antes", 1, s.id.startsWith("SAV"), " p.p.") };

      borderColor: css(s.color), backgroundColor: css(s.color), borderWidth: s.dashed ? 1.5 : 2.5, borderDash: s.dashed ? [5, 4] : [], pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true }));

/* ---------- ordem dos gráficos ---------- */
const MODULES = [INFL, INFWAGE, BCEEUR, GDPUNE, ECOCOMP, TRADE, BONDS, GOV, FAM, HPIPT, HOUSE, HOUSEWAGE, OVER, RENT, MRATE, MLOANS, MORT, BUILD, DEMAND, MIGR, FUEL, OIL, METALS, FX, STOCKS, ETFS, CRYPTO];
/* =====================================================================
   PREVISÕES: FMI (World Economic Outlook) e expectativas do mercado (curva de juros do BCE)
   ===================================================================== */
const FC = { imf: null, yc: null, ycPromise: null };
async function loadFC(force) {
  try { const j = await ghJson("previsoes.json", force); FC.imf = j?.fmi || null; } catch (e) { FC.imf = null; }
}
// anos futuros (ou o ano em curso ainda sem dados completos) com previsão do FMI
function imfAfter(ind, lastDataYear) {
  const v = FC.imf?.valores?.[ind]; if (!v) return [];
  const now = new Date().getFullYear();
  return Object.keys(v).map(Number).filter(y => y > lastDataYear && y >= now && y <= now + 4).sort().map(y => [y, v[y]]);
}
const imfNote = () => FC.imf ? `Previsões: ${FC.imf.fonte}${FC.imf.obtido ? ", obtidas a " + dayLabel(FC.imf.obtido) : ""}.` : "";
const fcList = (pairs, d = 1, unit = "%") => pairs.map(([y, v]) => `${fmt(v, d)}${unit} em ${y}`).join(pairs.length > 2 ? "; " : " e ").replace(/; ([^;]*)$/, " e $1");

// curva de juros do BCE: taxas forward instantâneas (obrigações AAA da zona euro) de 3 meses a 2 anos
function getYC() {
  if (FC.ycPromise) return FC.ycPromise;
  const hs = ["3M", "6M", "9M", "1Y", "1Y3M", "1Y6M", "1Y9M", "2Y"];
  FC.ycPromise = getCSV(ECB + "YC/B.U2.EUR.4F.G_N_A.SV_C_YM." + hs.map(h => "IF_" + h).join("+") + "?format=csvdata&lastNObservations=1")
    .then(rows => {
      const pts = [], date = rows.map(r => r.t).sort().pop();
      for (const r of rows) {
        const m = r.key.match(/IF_(?:(\d+)Y)?(?:(\d+)M)?$/); if (!m || r.v == null) continue;
        pts.push({ months: (+(m[1] || 0)) * 12 + (+(m[2] || 0)), v: r.v });
      }
      pts.sort((a, b) => a.months - b.months);
      FC.yc = pts.length ? { date, pts } : null;
      return FC.yc;
    }).catch(() => (FC.yc = null));
  return FC.ycPromise;
}
// taxa de curto prazo esperada daqui a h meses, ancorada na taxa do BCE atual
function expectedRate(dfrNow, h) {
  const p = FC.yc?.pts; if (!p?.length) return null;
  const base = p[0].v;
  let lo = p[0], hi = p[p.length - 1];
  for (let k = 0; k < p.length - 1; k++) if (p[k].months <= h && p[k + 1].months >= h) { lo = p[k]; hi = p[k + 1]; }
  const v = h <= lo.months ? lo.v : h >= hi.months ? hi.v : lo.v + (hi.v - lo.v) * (h - lo.months) / (hi.months - lo.months);
  return dfrNow + (v - base);
}
const ycNote = () => FC.yc ? `Expectativas do mercado: estimativa feita pela página a partir da curva de juros do BCE de ${dayLabel(FC.yc.date)} (obrigações AAA da zona euro); não é uma previsão oficial.` : "";
const addMonths = (m, n) => { let [y, mo] = m.split("-").map(Number); mo += n; while (mo > 12) { mo -= 12; y++; } return y + "-" + String(mo).padStart(2, "0"); };

// --- Inflação vs salários: inflação prevista (FMI)
INFWAGE.fc = function (cd) {
  const last = cd.periods[cd.periods.length - 1]; if (!last) return null;
  const pairs = imfAfter("PCPIPCH", +last.slice(0, 4) - 1); if (!pairs.length) return null;
  const map = {}; pairs.forEach(([y, v]) => map[y + "-12"] = v);
  return { periods: monthsBetween(addMonths(last, 1), pairs[pairs.length - 1][0] + "-12"),
           sets: [{ label: "Inflação prevista (FMI, média do ano)", color: "--inf", map, follows: "INF", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: inflação ${fmt(v, 1)}%` }] };
};
// --- Inflação: previsão do FMI
INFL.fc = function (cd) {
  const last = cd.periods[cd.periods.length - 1]; if (!last) return null;
  const pairs = imfAfter("PCPIPCH", +last.slice(0, 4) - 1); if (!pairs.length) return null;
  const map = {}; pairs.forEach(([y, v]) => map[y + "-12"] = v);
  return { periods: monthsBetween(addMonths(last, 1), pairs[pairs.length - 1][0] + "-12"),
           sets: [{ label: "Inflação prevista (FMI, média do ano)", color: "--inf", map, follows: "IPC", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: inflação ${fmt(v, 1)}%` }] };
};
// --- PIB e desemprego (FMI)
GDPUNE.fc = function (cd) {
  const last = cd.periods[cd.periods.length - 1]; if (!last) return null;
  const g = imfAfter("NGDP_RPCH", +last.slice(0, 4) - 1), u = imfAfter("LUR", +last.slice(0, 4) - 1);
  if (!g.length && !u.length) return null;
  const mg = {}, mu = {}; g.forEach(([y, v]) => mg[y + "-12"] = v); u.forEach(([y, v]) => mu[y + "-12"] = v);
  const endY = Math.max(...[...g, ...u].map(x => x[0]));
  return { periods: monthsBetween(addMonths(last, 1), endY + "-12"), sets: [
    { label: "PIB previsto (FMI)", color: "--gdp", map: mg, follows: "GDP", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: PIB ${sign(v)}${fmt(Math.abs(v), 1)}%` },
    { label: "Desemprego previsto (FMI)", color: "--une", map: mu, follows: "UNE", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: desemprego ${fmt(v, 1)}%` }] };
};
// --- Contas com o exterior (FMI)
TRADE.fc = function (cd) {
  const last = cd.periods[cd.periods.length - 1]; if (!last) return null;
  const c = imfAfter("BCA_NGDPD", +last.slice(0, 4) - (last.endsWith("Q4") ? 0 : 1)); if (!c.length) return null;
  const map = {}; c.forEach(([y, v]) => map[y + "-Q4"] = v);
  const per = []; let q = last; while (q < c[c.length - 1][0] + "-Q4") { let [y, t] = q.split("-Q").map(Number); t++; if (t > 4) { t = 1; y++; } q = y + "-Q" + t; per.push(q); }
  return { periods: per, sets: [{ label: "Balança corrente prevista (FMI)", color: "--ca", map, follows: "CA", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: balança corrente ${sign(v)}${fmt(Math.abs(v), 1)}% do PIB` }] };
};
// --- Dívida pública e défice (FMI)
GOV.fc = function (cd) {
  const last = cd.periods[cd.periods.length - 1]; if (!last) return null;
  const ly = +last.slice(0, 4) - (last.endsWith("Q4") ? 0 : 1);
  const dbt = imfAfter("GGXWDG_NGDP", ly), bal = imfAfter("GGXCNL_NGDP", ly); if (!dbt.length && !bal.length) return null;
  const md = {}, mb = {}; dbt.forEach(([y, v]) => md[y + "-Q4"] = v); bal.forEach(([y, v]) => mb[y + "-Q4"] = v);
  const endY = Math.max(...[...dbt, ...bal].map(x => x[0]));
  const per = []; let q = last; while (q < endY + "-Q4") { let [y, t] = q.split("-Q").map(Number); t++; if (t > 4) { t = 1; y++; } q = y + "-Q" + t; per.push(q); }
  return { periods: per, sets: [
    { label: "Dívida prevista (FMI)", color: "--debt", map: md, follows: "DEBT", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: dívida ${fmt(v, 1)}% do PIB` },
    { label: "Saldo previsto (FMI)", color: "--ratio", map: mb, follows: "BAL", yAxisID: "y2", tip: (p, v) => ` Previsão FMI ${p.slice(0, 4)}: saldo ${sign(v)}${fmt(Math.abs(v), 1)}% do PIB` }] };
};
// --- BCE vs Euribor: expectativas do mercado
BCEEUR.fc = function (cd) {
  const B = cd.values.BCE, E = cd.values.E12, iB = lastIdx(B), iE = lastIdx(E);
  if (iB < 0 || !FC.yc) return null;
  const last = cd.periods[cd.periods.length - 1], dfr = B[iB], gap = iE >= 0 ? E[iE] - B[iB] : null;
  const mb = {}, me = {};
  mb[cd.periods[iB]] = dfr; if (gap != null) me[cd.periods[iE]] = E[iE];
  for (let h = 3; h <= 24; h += 3) { const r = expectedRate(dfr, h); if (r == null) continue; const p = addMonths(cd.periods[iB], h); mb[p] = r; if (gap != null) me[p] = r + gap; }
  return { periods: monthsBetween(addMonths(last, 1), addMonths(cd.periods[iB], 24)), sets: [
    { label: "Taxa BCE esperada (mercado)", color: "--bce", map: mb, follows: "BCE", tip: (p, v) => ` Mercado espera BCE em ${monthLabel(p)}: ${fmt(v, 2)}%` },
    { label: "Euribor 12M esperada (mercado)", color: "--m12", map: me, follows: "E12", tip: (p, v) => ` Mercado espera Euribor 12M em ${monthLabel(p)}: ${fmt(v, 2)}%` }] };
};
// --- Juros dos novos créditos: com a Euribor esperada
MRATE.fc = function (cd) {
  const T = cd.values.TAXA, E = cd.values.E12, i = lastIdx(T); if (i < 0 || !FC.yc) return null;
  const bceData = state.bceeur?.data; if (!bceData) return null;
  const dfr = bceData.values.BCE[lastIdx(bceData.values.BCE)];
  const map = { [cd.periods[i]]: T[i] }, e0 = expectedRate(dfr, 0) ?? dfr;
  for (let h = 3; h <= 24; h += 3) { const r = expectedRate(dfr, h); if (r != null) map[addMonths(cd.periods[i], h)] = T[i] + (r - e0); }
  return { periods: monthsBetween(addMonths(cd.periods[cd.periods.length - 1], 1), addMonths(cd.periods[i], 24)),
           sets: [{ label: "Taxa esperada (mercado)", color: "--l200", map, follows: "TAXA", tip: (p, v) => ` Esperado em ${monthLabel(p)}: ${fmt(v, 2)}%` }] };
};
// --- Prestação: com a Euribor esperada
MORT.fc = function (cd) {
  const tax = cd.values.TAX, i = lastIdx(tax); if (i < 0 || !FC.yc) return null;
  const bceData = state.bceeur?.data; if (!bceData) return null;
  const dfr = bceData.values.BCE[lastIdx(bceData.values.BCE)], e0 = expectedRate(dfr, 0) ?? dfr;
  const m2 = { [cd.periods[i]]: cd.values.L200[i] }, m1 = { [cd.periods[i]]: cd.values.L100[i] };
  for (let h = 3; h <= 24; h += 3) { const r = expectedRate(dfr, h); if (r == null) continue; const t = Math.max(tax[i] + (r - e0), 0), p = addMonths(cd.periods[i], h);
    m2[p] = this.payment(200000, t); m1[p] = this.payment(100000, t); }
  return { periods: monthsBetween(addMonths(cd.periods[cd.periods.length - 1], 1), addMonths(cd.periods[i], 24)), sets: [
    { label: "Prestação esperada · 200 000 €", color: "--l200", map: m2, follows: "L200", tip: (p, v) => ` Esperado em ${monthLabel(p)} (200 000 €): ${fmt(Math.round(v), 0)} €/mês` },
    { label: "Prestação esperada · 100 000 €", color: "--l100", map: m1, follows: "L100", tip: (p, v) => ` Esperado em ${monthLabel(p)} (100 000 €): ${fmt(Math.round(v), 0)} €/mês` }] };
};

// frases de previsão nos comentários
function withFcSentence(m, fn) {
  const orig = m.verdict;
  m.verdict = function (d) { const v = orig.call(this, d); try { const x = fn.call(this, d); if (x && v.msg) v.msg += " " + x; else if (x) v.msg = x; } catch (e) {} return v; };
}
withFcSentence(INFWAGE, d => { const ly = +(Object.keys(d.monthly).sort().pop() || "0").slice(0, 4) - 1; const p = imfAfter("PCPIPCH", ly); return p.length ? `O FMI prevê inflação média de ${fcList(p.slice(0, 3))}.` : ""; });
withFcSentence(GDPUNE, d => { const q = d.periods[d.periods.length - 1] || "0"; const ly = +q.slice(0, 4) - 1; const g = imfAfter("NGDP_RPCH", ly).slice(0, 2), u = imfAfter("LUR", ly).slice(0, 2);
  return g.length ? `O FMI prevê crescimento do PIB de ${fcList(g)}` + (u.length ? `, com desemprego de ${fcList(u)}.` : ".") : ""; });
withFcSentence(TRADE, d => { const q = d.periods[d.periods.length - 1] || "0"; const c = imfAfter("BCA_NGDPD", +q.slice(0, 4) - (q.endsWith("Q4") ? 0 : 1)).slice(0, 2);
  return c.length ? `O FMI prevê uma balança corrente de ${c.map(([y, v], k) => `${sign(v)}${fmt(Math.abs(v), 1)}%${k === 0 ? " do PIB" : ""} em ${y}`).join(" e ")}.` : ""; });
withFcSentence(GOV, d => {
  const q = d.periods[d.periods.length - 1] || "0", ly = +q.slice(0, 4) - (q.endsWith("Q4") ? 0 : 1);
  const dd = imfAfter("GGXWDG_NGDP", ly), bb = imfAfter("GGXCNL_NGDP", ly); if (!dd.length) return "";
  const y = dd[Math.min(1, dd.length - 1)], b = bb.find(x => x[0] === y[0]), now = d.values.DEBT[lastIdx(d.values.DEBT)];
  const verbo = now == null ? "fique em" : y[1] < now - 0.5 ? "desça para" : y[1] > now + 0.5 ? "suba para" : "fique em";
  return `O FMI prevê que a dívida ${verbo} ${fmt(y[1], 0)}% do PIB em ${y[0]}` + (b ? `, com um saldo orçamental de ${sign(b[1])}${fmt(Math.abs(b[1]), 1)}%.` : ".");
});
withFcSentence(BCEEUR, d => { const B = d.values.BCE, i = lastIdx(B); if (i < 0 || !FC.yc) return "";
  const r12 = expectedRate(B[i], 12), r24 = expectedRate(B[i], 24); if (r12 == null) return "";
  const E = d.values.E12, iE = lastIdx(E), gap = iE >= 0 ? E[iE] - B[i] : 0;
  return `Pela curva de juros, o mercado espera a taxa do BCE em cerca de ${fmt(r12, 2)}% daqui a um ano${r24 != null ? ` e ${fmt(r24, 2)}% daqui a dois` : ""}, o que poria a Euribor a 12 meses perto de ${fmt(r12 + gap, 2)}%.`; });
withFcSentence(MORT, function (d) { const v = this.calc(d), i = lastIdx(v.TAX); const b = state.bceeur?.data; if (i < 0 || !FC.yc || !b) return "";
  const dfr = b.values.BCE[lastIdx(b.values.BCE)], e0 = expectedRate(dfr, 0) ?? dfr, r = expectedRate(dfr, 12); if (r == null) return "";
  const p = this.payment(200000, Math.max(v.TAX[i] + (r - e0), 0)), dp = p - v.L200[i];
  return `Com as expectativas do mercado, daqui a um ano a prestação de 200 000 € seria de cerca de ${fmt(Math.round(p), 0)} € (${Math.abs(dp) < 1 ? "igual" : (dp > 0 ? "mais " : "menos ") + fmt(Math.abs(Math.round(dp)), 0) + " €"}).`; });
withFcSentence(MRATE, d => { const T = d.values.TAXA, i = lastIdx(T), b = state.bceeur?.data; if (i < 0 || !FC.yc || !b) return "";
  const dfr = b.values.BCE[lastIdx(b.values.BCE)], e0 = expectedRate(dfr, 0) ?? dfr, r = expectedRate(dfr, 12); if (r == null) return "";
  return `Se as expectativas do mercado se confirmarem, a taxa dos novos créditos rondará ${fmt(T[i] + (r - e0), 2)}% daqui a um ano.`; });

// notas das fontes das previsões
for (const [m, note] of [[INFWAGE, imfNote], [GDPUNE, imfNote], [TRADE, imfNote], [GOV, imfNote], [BCEEUR, ycNote], [MRATE, ycNote], [MORT, ycNote]]) m.fcNote = note;
// os três gráficos com expectativas do mercado precisam da curva de juros
for (const m of [BCEEUR, MRATE, MORT]) { const orig = m.load; m.load = async function (...a) { const [r] = await Promise.all([orig.apply(this, a), getYC()]); return r; }; }

/* ---------- construção e desenho genéricos ---------- */
const state = {};

function build() {
  for (const m of MODULES) {
    const el = document.createElement("div");
    el.className = "module";
    el.innerHTML = `
      <h3 class="chart-title"><button class="toggle" aria-expanded="true"><span class="chev" aria-hidden="true">▾</span><span>${m.title}</span><span class="hint">fechar</span><span class="peek"></span></button><button class="refresh" title="Atualizar só este gráfico"><span class="ic" aria-hidden="true">↻</span><span class="rl">Atualizar</span></button></h3>
      <div class="module-body">
      <div class="verdict"><div class="headline"><span class="mark"></span>A obter dados…</div><p></p></div>
      <div class="rates${m.rateCols ? " multi" : ""}" style="--cols:${m.rateCols || m.series.length}"></div>
      ${m.controlsHTML ? `<div class="controls">${m.controlsHTML()}</div>` : ""}
      <div class="ranges" role="group" aria-label="Período do gráfico ${m.title}">
        ${[1, 3, 5, 10, 0].map(y => `<button data-y="${y}" aria-pressed="${y === m.defaultYears}">${y ? y + (y === 1 ? " ano" : " anos") : "Tudo"}</button>`).join("")}
      </div>
      <div class="chart"><canvas aria-label="Gráfico: ${m.title}"></canvas><div class="msg">A obter dados${m.sourceName ? " do " + m.sourceName : " do Banco Central Europeu"}…</div></div>
      <p class="src">${m.source}</p><p class="src fcnote" hidden></p>
      <p class="src err" hidden></p>
      </div>`;
    $(m.container || "modules").appendChild(el);
    const st = state[m.key] = {
      data: null, years: m.defaultYears, chart: null, visible: {},
      els: { verdict: el.querySelector(".verdict"), rates: el.querySelector(".rates"), ranges: el.querySelector(".ranges"),
             canvas: el.querySelector("canvas"), msg: el.querySelector(".msg"), err: el.querySelector(".err") },
    };
    m.series.forEach(s => st.visible[s.id] = !s.off);
    if (m.bindControls) m.bindControls(el, () => render(m));
    // abrir / fechar (lembra a escolha)
    const tg = el.querySelector(".toggle"), hint = el.querySelector(".hint");
    st.els.module = el; st.els.peek = el.querySelector(".peek");
    const setFold = folded => {
      el.classList.toggle("folded", folded);
      tg.setAttribute("aria-expanded", String(!folded));
      hint.textContent = folded ? "abrir" : "fechar";
    };
    setFold(true);   // os gráficos começam sempre fechados
    tg.addEventListener("click", () => {
      const f = !el.classList.contains("folded");
      setFold(f);
      if (!f) render(m);
    });
    // atualizar só este gráfico
    const rb = el.querySelector(".refresh");
    st.els.refresh = rb;
    rb.addEventListener("click", async () => {
      if (rb.disabled) return;
      await loadModule(m, true);
      updateStatus();
    });
    st.els.ranges.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      st.years = +b.dataset.y;
      for (const x of st.els.ranges.children) x.setAttribute("aria-pressed", x === b);
      render(m);
    });
    try { const c = JSON.parse(localStorage.getItem("ind-" + m.key)); if (c && c.periods && c.values) st.data = c; } catch (e) {}
  }
}

function render(m) {
  const st = state[m.key], d = st.data;
  if (!d) return;
  try {
    // comentário
    const v = m.verdict(d);
    st.els.verdict.style.setProperty("--vc", v.color);
    st.els.verdict.querySelector(".headline").innerHTML = '<span class="mark" aria-hidden="true"></span>' + v.text;
    st.els.verdict.querySelector("p").textContent = v.msg;
    const fn = st.els.module.querySelector(".fcnote"); if (fn) { const t = m.fcNote ? m.fcNote() : ""; fn.hidden = !t; fn.textContent = t; }
    st.els.peek.style.setProperty("--vc", v.color);
    st.els.peek.innerHTML = '<span class="dot"></span>' + v.text;

    // valores
    st.els.rates.innerHTML = "";
    for (const r of m.rates(d)) {
      const s = m.series.find(x => x.id === r.id);
      const b = document.createElement("button");
      b.className = "rate";
      b.style.setProperty("--c", `var(${s.color})`);
      b.setAttribute("aria-pressed", st.visible[r.id]);
      const val = r.value == null ? "—" : (r.signed ? sign(r.value) + fmt(Math.abs(r.value), r.d) : fmt(r.value, r.d)) + `<small>${r.unit}</small>`;
      b.innerHTML = `<div class="name">${r.name}</div><div class="value">${val}</div><div class="delta">${r.deltas}</div>`;
      b.onclick = () => { st.visible[r.id] = !st.visible[r.id]; render(m); };
      st.els.rates.appendChild(b);
    }

    // gráfico
    let cd = m.chartData ? m.chartData(d) : { periods: d.periods, values: d.values };
    const perYear = m.chartPerYear || m.perYear, labelFn = m.chartLabel || m.label;
    let nowIdx = -1;
    for (const id in cd.values) nowIdx = Math.max(nowIdx, lastIdx(cd.values[id]));
    let end = nowIdx + 1;
    let start = st.years ? Math.max(0, end - st.years * perYear) : 0;
    // previsões (FMI / mercado): prolongam o eixo para a frente
    let fcSets = [];
    const fcr = m.fc ? (() => { try { return m.fc(cd); } catch (e) { console.warn(m.key, e); return null; } })() : null;
    if (fcr && fcr.sets?.length) {
      const lastP = cd.periods[cd.periods.length - 1];
      const add = fcr.periods.filter(p => p > lastP);
      if (add.length) cd = { periods: cd.periods.concat(add), values: Object.fromEntries(Object.entries(cd.values).map(([k, a]) => [k, a.concat(add.map(() => null))])) };
      fcSets = fcr.sets;
      end = cd.periods.length;
    }
    if (st.years && m.byDate && end > 0) { const cut = diasAntes(cd.periods[end - 1], Math.round(st.years * 365.25)); start = cd.periods.findIndex(p => p >= cut); if (start < 0) start = 0; }
    const grid = css("--line"), muted = css("--muted"), ink = css("--ink"), surface = css("--surface");
    st.els.msg.hidden = true;
    if (st.chart) st.chart.destroy();
    st.chart = new Chart(st.els.canvas, {
      type: "line",
      data: { labels: cd.periods.slice(start, end).map(labelFn), datasets: m.datasets(cd, start, end, st.visible).concat(fcSets.map(fs => ({
        type: "line", label: fs.label, fcTip: fs.tip, fcPeriods: cd.periods.slice(start, end),
        data: cd.periods.slice(start, end).map(p => fs.map[p] ?? null), yAxisID: fs.yAxisID || "y",
        hidden: fs.follows ? !st.visible[fs.follows] : false,
        borderColor: css(fs.color), backgroundColor: css("--surface"), borderWidth: 2, borderDash: [3, 3],
        pointRadius: 3.5, pointBorderWidth: 2, pointHoverRadius: 5, spanGaps: true, tension: 0, order: 0,
      }))) },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: surface, titleColor: ink, bodyColor: ink, borderColor: grid, borderWidth: 1,
            padding: 10, boxPadding: 4, usePointStyle: true,
            callbacks: { label: c => c.dataset.fcTip ? c.dataset.fcTip(c.dataset.fcPeriods[c.dataIndex], c.parsed.y) : m.tooltip(m.series[c.datasetIndex], c.parsed.y) },
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 24 }, border: { color: grid } },
          y: { grid: { color: grid }, border: { display: false }, ticks: { color: muted, callback: m.yTick } },
          ...(m.y2 ? { y2: { position: "right", grid: { display: false }, border: { display: false }, ticks: { color: muted, callback: m.y2.tick } } } : {}),
        },
      },
    });
  } catch (e) {
    console.error(m.key, e);
    st.els.msg.hidden = false;
    st.els.msg.textContent = "Erro ao desenhar este gráfico: " + e.message;
  }
}
const renderAll = () => MODULES.forEach(render);

/* ---------- atualização ---------- */
let lastLoad = 0;
async function loadModule(m, force = true) {
  const st = state[m.key];
  if (!force && m.maxAge && st.data?.fetchedAt && Date.now() - st.data.fetchedAt < m.maxAge && !st.data.errors?.length) {
    const rl0 = st.els.refresh?.querySelector(".rl");
    if (rl0) rl0.textContent = "Atualizar · " + new Date(st.data.fetchedAt).toLocaleString("pt-PT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    render(m); return;
  }
  const rb = st.els.refresh, rl = rb && rb.querySelector(".rl");
  if (rb) { rb.disabled = true; rb.classList.add("busy"); rl.textContent = "A atualizar…"; }
  try {
    st.data = await m.load(st.data, force);
    try { localStorage.setItem("ind-" + m.key, JSON.stringify(st.data)); } catch (e) {}
    st.failed = false;
    st.els.err.hidden = !st.data.errors.length;
    st.els.err.textContent = st.data.errors.length ? "Não atualizou: " + st.data.errors.join("; ") + ". Essa parte mostra os últimos dados guardados." : "";
  } catch (e) {
    st.failed = true;
    if (st.data) { st.els.err.hidden = false; st.els.err.textContent = "Sem ligação ao " + (m.sourceName || "BCE") + " (" + e.message + "). A mostrar os dados de " + timeLabel(st.data.fetchedAt) + "."; }
    else {
      st.els.msg.hidden = false;
      st.els.msg.textContent = "Não foi possível ligar ao " + (m.sourceName || "Banco Central Europeu") + ": " + e.message + ". Verifica a ligação à internet e carrega em Atualizar.";
      st.els.verdict.querySelector(".headline").innerHTML = '<span class="mark"></span>Sem dados';
    }
  }
  if (rb) {
    rb.disabled = false; rb.classList.remove("busy");
    rl.textContent = "Atualizar";
    rb.title = st.data?.fetchedAt ? "Atualizado " + timeLabel(st.data.fetchedAt) + " — carrega para atualizar só este gráfico" : "Atualizar só este gráfico";
    if (m.maxAge && st.data?.fetchedAt) rl.textContent = "Atualizar · " + new Date(st.data.fetchedAt).toLocaleString("pt-PT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  render(m);
}
function updateStatus() {
  const bad = MODULES.filter(m => state[m.key].failed || state[m.key].data?.errors?.length);
  const times = MODULES.map(m => state[m.key].data?.fetchedAt).filter(Boolean);
  if (!times.length) { $("dot").className = "dot err"; $("statusText").textContent = "Sem dados: ver avisos"; return; }
  if (!bad.length) { $("dot").className = "dot ok"; $("statusText").textContent = "Atualizado " + timeLabel(Math.min(...times)); }
  else { $("dot").className = "dot err"; $("statusText").textContent = "Atualizado em parte: ver avisos a vermelho"; }
}
async function loadAll(force = false) {
  loadFC(force).then(() => MODULES.filter(m => m.fc && state[m.key].data).forEach(render));
  lastLoad = Date.now();
  $("dot").className = "dot busy";
  $("statusText").textContent = "A atualizar…";
  await Promise.all(MODULES.map(m => loadModule(m, force)));
  updateStatus();
}

$("refresh").onclick = () => loadAll(true);
// separadores
function showTab(t) {
  if (t === "op") t = "hab";
  const ok = [...document.querySelectorAll("#tabs button")].some(b => b.dataset.tab === t);
  if (!ok) t = "eco";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  document.querySelectorAll("section.block[data-tab]").forEach(sec => { sec.hidden = sec.dataset.tab !== t; });
  try { localStorage.setItem("tab", t); } catch (e) {}
  if (location.hash.slice(1) !== t) history.replaceState(null, "", "#" + t);
  MODULES.filter(m => (m.container || "modules") === document.querySelector(`section.block[data-tab="${t}"] > div[id]`)?.id && !state[m.key].els.module.classList.contains("folded")).forEach(render);
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastLoad > 3600e3) loadAll();
});
setInterval(loadAll, 6 * 3600e3);

build();
renderAll();
showTab(location.hash.slice(1) || (() => { try { return localStorage.getItem("tab"); } catch (e) { return null; } })() || "eco");
loadAll();
</script>
</body>
</html>
